<!DOCTYPE html>
<!-- Atelier Kinetik · FX 01 · Cosmic Starfield — 3 parallax layers + shooting stars. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Cosmic Starfield</title>
<style>html,body{margin:0;height:100%;background:#070709;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, quality = 1, stars = [], meteors = [], meteorTimer = 0;
  let fpsAcc = 0, fpsN = 0, degraded = false;
  function govern(dtMs) { if (degraded) return; fpsAcc += dtMs; fpsN++; if (fpsN >= 120) { if (fpsAcc / fpsN > 21) { degraded = true; quality *= 0.55; build(); } fpsAcc = 0; fpsN = 0; } }
  const rand = (a, b) => a + Math.random() * (b - a);

  function build() {
    stars = [];
    const layers = [{ n: 170, r: 0.7, s: 6 }, { n: 110, r: 1.3, s: 14 }, { n: 55, r: 2.1, s: 26 }];
    const area = (W * H) / (1440 * 900);
    layers.forEach((L, li) => {
      const count = Math.max(12, Math.round(L.n * area * quality));
      for (let i = 0; i < count; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, r: rand(L.r * 0.6, L.r * 1.4),
          layer: li, phase: Math.random() * Math.PI * 2, speed: L.s, baseA: rand(0.35, 0.95) });
      }
    });
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function drawSky(t) {
    const g = ctx.createRadialGradient(W * 0.82, H * 0.14, 0, W * 0.82, H * 0.14, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#0E0B14'); g.addColorStop(0.55, '#070709'); g.addColorStop(1, '#050507');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // flame nebula kiss, upper right
    const n = ctx.createRadialGradient(W * 0.84, H * 0.15, 0, W * 0.84, H * 0.15, W * 0.42);
    n.addColorStop(0, 'rgba(255,61,0,0.16)'); n.addColorStop(1, 'rgba(255,61,0,0)');
    ctx.fillStyle = n; ctx.fillRect(0, 0, W, H);
    stars.forEach(s => {
      const tw = 0.55 + 0.45 * Math.sin(t * 0.0016 + s.phase);
      ctx.globalAlpha = s.baseA * tw;
      ctx.fillStyle = s.layer === 2 ? '#FFF7EA' : '#F4F2EC';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  function spawnMeteor() {
    meteors.push({ x: rand(W * 0.35, W * 0.98), y: rand(0, H * 0.3), vx: rand(-560, -380), vy: rand(240, 330), life: 1 });
  }
  function drawMeteors(dt) {
    meteors = meteors.filter(m => m.life > 0);
    meteors.forEach(m => {
      m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt * 1.15;
      const tx = m.x - m.vx * 0.16, ty = m.y - m.vy * 0.16;
      const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,255,' + Math.max(0, m.life) + ')');
      g.addColorStop(0.25, 'rgba(255,214,170,' + Math.max(0, m.life * 0.8) + ')');
      g.addColorStop(1, 'rgba(255,214,170,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    });
  }
  function frame(t, prev) {
    const dtMs = t - prev;
    govern(dtMs);
    const dt = Math.min(0.05, dtMs / 1000 || 0.016);
    drawSky(t);
    // slow parallax drift downward-left, wraps
    stars.forEach(s => { s.x += s.speed * dt * 0.12; s.y += s.speed * dt * 0.05; if (s.x > W + 4) s.x = -4; if (s.y > H + 4) s.y = -4; });
    meteorTimer -= dt;
    if (meteorTimer <= 0) { spawnMeteor(); meteorTimer = rand(1.6, 4.5); }
    drawMeteors(dt);
    if (!RM) requestAnimationFrame((now) => frame(now, t));
  }
  resize(); addEventListener('resize', resize);
  if (RM) drawSky(0); else requestAnimationFrame((t) => frame(t, t));
})();
</script>
</body>
</html>
