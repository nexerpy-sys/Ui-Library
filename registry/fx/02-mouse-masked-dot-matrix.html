<!DOCTYPE html>
<!-- Atelier Kinetik · FX 02 · Mouse-Masked Dot Matrix. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Mouse-Masked Dot Matrix</title>
<style>html,body{margin:0;height:100%;background:#070709;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, quality = 1, spacing = 26, cols = 0, rows = 0;
  const pointer = { x: -9999, y: -9999, active: false };
  let start = performance.now(), lastFrame = 0;
  let fpsAcc = 0, fpsN = 0, degraded = false;
  function govern(dtMs) { if (degraded) return; fpsAcc += dtMs; fpsN++; if (fpsN >= 120) { if (fpsAcc / fpsN > 21) { degraded = true; quality *= 0.55; build(); } fpsAcc = 0; fpsN = 0; } }

  function build() {
    spacing = Math.max(17, Math.round(26 / quality));
    cols = Math.ceil(W / spacing) + 1; rows = Math.ceil(H / spacing) + 1;
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (RM) draw(performance.now());
  }
  addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  addEventListener('pointerleave', () => { pointer.active = false; });

  function draw(now) {
    govern(now - lastFrame); lastFrame = now;
    ctx.fillStyle = '#070709'; ctx.fillRect(0, 0, W, H);
    const t = (now - start) / 1000;
    // idle drift pulse travels diagonally when no pointer (touch devices)
    const idleX = pointer.active ? pointer.x : W * (0.5 + 0.42 * Math.sin(t * 0.35));
    const idleY = pointer.active ? pointer.y : H * (0.5 + 0.38 * Math.cos(t * 0.27));
    const R = Math.max(120, Math.min(W, H) * 0.24);
    for (let j = 0; j <= rows; j++) {
      for (let i = 0; i <= cols; i++) {
        const x = i * spacing, y = j * spacing;
        const d = Math.hypot(x - idleX, y - idleY);
        const glow = Math.max(0, 1 - d / R);
        const wave = 0.5 + 0.5 * Math.sin(t * 1.4 - (x + y) * 0.012);
        const base = 0.10 + wave * 0.05;
        const a = base + glow * glow * 0.85;
        const r = 1.05 + glow * glow * 2.35 + wave * 0.22;
        ctx.fillStyle = glow > 0.42 ? 'rgba(255,97,38,' + a + ')' : 'rgba(244,242,236,' + a + ')';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (!RM) requestAnimationFrame(draw);
  }
  resize(); addEventListener('resize', resize);
  if (RM) draw(performance.now()); else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
