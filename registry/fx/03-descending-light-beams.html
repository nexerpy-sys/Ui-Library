<!DOCTYPE html>
<!-- Atelier Kinetik · FX 03 · Descending Light Beams. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Descending Light Beams</title>
<style>html,body{margin:0;height:100%;background:#070709;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, quality = 1, beams = [], dust = [];
  let fpsAcc = 0, fpsN = 0, degraded = false;
  const rand = (a, b) => a + Math.random() * (b - a);

  function govern(dtMs) {
    if (degraded) return;
    fpsAcc += dtMs; fpsN++;
    if (fpsN >= 120) { if (fpsAcc / fpsN > 21) { degraded = true; quality *= 0.55; build(); } fpsAcc = 0; fpsN = 0; }
  }
  function build() {
    beams = [];
    const n = Math.max(3, Math.round(7 * quality));
    for (let i = 0; i < n; i++) {
      beams.push({ x: rand(0.05, 0.95), w: rand(0.03, 0.09), speed: rand(0.016, 0.03), phase: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.28 ? '255,61,0' : '210,228,255', maxA: rand(0.10, 0.22) });
    }
    dust = [];
    const dn = Math.max(20, Math.round(70 * quality));
    for (let i = 0; i < dn; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, r: rand(0.4, 1.5), v: rand(12, 42), a: rand(0.15, 0.55) });
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build(); if (RM) draw(0, 0);
  }
  function draw(t, dt) {
    ctx.fillStyle = '#070709'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    beams.forEach(b => {
      const cx = b.x * W + Math.sin(t * 0.00021 + b.phase) * W * 0.045;
      const bw = b.w * W;
      const pulse = 0.72 + 0.28 * Math.sin(t * 0.0006 + b.phase * 1.7);
      const g = ctx.createLinearGradient(0, -H * 0.1, 0, H * 1.05);
      const a = b.maxA * pulse;
      g.addColorStop(0, 'rgba(' + b.hue + ',' + a + ')');
      g.addColorStop(0.72, 'rgba(' + b.hue + ',' + (a * 0.42) + ')');
      g.addColorStop(1, 'rgba(' + b.hue + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - bw * 0.35, -H * 0.1);
      ctx.lineTo(cx + bw * 0.35, -H * 0.1);
      ctx.lineTo(cx + bw, H * 1.05);
      ctx.lineTo(cx - bw, H * 1.05);
      ctx.closePath(); ctx.fill();
      // floor kiss where the beam lands
      const fg = ctx.createRadialGradient(cx, H * 0.97, 0, cx, H * 0.97, bw * 1.7);
      fg.addColorStop(0, 'rgba(' + b.hue + ',' + (a * 0.7) + ')'); fg.addColorStop(1, 'rgba(' + b.hue + ',0)');
      ctx.fillStyle = fg; ctx.fillRect(cx - bw * 2, H * 0.8, bw * 4, H * 0.25);
    });
    dust.forEach(p => {
      p.y += p.v * (dt || 0.016); p.x += Math.sin((p.y + p.r * 90) * 0.01) * 0.12;
      if (p.y > H + 2) { p.y = -2; p.x = Math.random() * W; }
      ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(t * 0.002 + p.x));
      ctx.fillStyle = '#E8ECF4'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  let prev = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000 || 0.016);
    govern(t - prev); prev = t;
    draw(t, dt);
    if (!RM) requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (RM) draw(0, 0); else requestAnimationFrame((t) => { prev = t; frame(t); });
})();
</script>
</body>
</html>
