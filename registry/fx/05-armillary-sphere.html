<!DOCTYPE html>
<!-- Atelier Kinetik · FX 05 · Armillary Sphere — three rotating projected rings + orbiting beads. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Armillary Sphere</title>
<style>html,body{margin:0;height:100%;background:#070709;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, R = 0;
  let fpsAcc = 0, fpsN = 0, degraded = false;
  function govern(dtMs) {
    if (degraded) return;
    fpsAcc += dtMs; fpsN++;
    if (fpsN >= 120) { if (fpsAcc / fpsN > 21) degraded = true; fpsAcc = 0; fpsN = 0; }
  }
  const TAU = Math.PI * 2;
  // Ring definition: radius (×R), base axis tilt (euler x,z), spin speed, color, bead count
  const RINGS = [
    { r: 1.00, ax: 0.32, az: 0.0, speed: 0.00016, color: '244,242,236', width: 1.5, beads: 2, beadSize: 2.6 },
    { r: 0.78, ax: 1.05, az: 0.5, speed: -0.00022, color: '255,61,0', width: 1.9, beads: 1, beadSize: 3.0 },
    { r: 0.56, ax: 1.85, az: -0.7, speed: 0.00030, color: '229,169,60', width: 1.3, beads: 1, beadSize: 2.2 },
    { r: 0.34, ax: 0.62, az: 1.1, speed: -0.00038, color: '0,240,255', width: 1.1, beads: 1, beadSize: 1.9 },
  ];
  function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }
  function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
  function rotZ(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]]; }

  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; R = Math.min(W, H) * 0.30;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function project(p, cx, cy) { return [cx + p[0], cy + p[1]]; }
  function ringPoint(ring, theta, spin) {
    // circle in local XY, spun about its own axis then tilted by euler
    let p = [Math.cos(theta) * ring.r * R, Math.sin(theta) * ring.r * R, 0];
    p = rotZ(p, spin * 0.0);            // ring plane fixed; spin moves beads — rings precess slowly instead
    p = rotX(p, ring.ax);
    p = rotY(p, ring.az + spin * 0.35); // precession
    return p;
  }
  function draw(t) {
    ctx.fillStyle = '#070709'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.52;
    // core glow
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.9);
    core.addColorStop(0, 'rgba(255,97,38,0.28)'); core.addColorStop(0.35, 'rgba(255,61,0,0.10)'); core.addColorStop(1, 'rgba(255,61,0,0)');
    ctx.fillStyle = core; ctx.fillRect(0, 0, W, H);
    const stamp = RM ? 5000 : t;
    // rings
    RINGS.forEach(ring => {
      const spin = stamp * ring.speed * 1000;
      ctx.lineWidth = ring.width;
      // draw as polyline with per-segment alpha for pseudo-depth
      const SEG = degraded ? 48 : 96;
      for (let i = 0; i < SEG; i++) {
        const a0 = (i / SEG) * TAU, a1 = ((i + 1) / SEG) * TAU;
        const p0 = project(ringPoint(ring, a0, spin), cx, cy);
        const p1 = project(ringPoint(ring, a1, spin), cx, cy);
        const depth = 0.5 + 0.5 * ((ringPoint(ring, (a0 + a1) / 2, spin)[2] / (ring.r * R || 1)) + 1) / 2;
        ctx.strokeStyle = 'rgba(' + ring.color + ',' + (0.14 + depth * 0.55).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      }
      // beads riding the ring
      for (let b = 0; b < ring.beads; b++) {
        const theta = spin * 2.6 + (b * TAU) / ring.beads;
        const bp = project(ringPoint(ring, theta, spin), cx, cy);
        const g = ctx.createRadialGradient(bp[0], bp[1], 0, bp[0], bp[1], ring.beadSize * 5);
        g.addColorStop(0, 'rgba(' + ring.color + ',0.9)'); g.addColorStop(1, 'rgba(' + ring.color + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bp[0], bp[1], ring.beadSize * 5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#FFF7EA'; ctx.beginPath(); ctx.arc(bp[0], bp[1], ring.beadSize * 0.62, 0, TAU); ctx.fill();
      }
    });
    // central ember
    const emb = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10);
    emb.addColorStop(0, '#FFF3E8'); emb.addColorStop(0.4, '#FF6A21'); emb.addColorStop(1, 'rgba(255,61,0,0)');
    ctx.fillStyle = emb; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, TAU); ctx.fill();
  }
  let prev = 0;
  function frame(t) {
    govern(t - prev); prev = t;
    draw(t);
    if (!RM) requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (RM) draw(0); else requestAnimationFrame((t) => { prev = t; frame(t); });
})();
</script>
</body>
</html>
