<!DOCTYPE html>
<!-- Atelier Kinetik · FX 06 · Nebula Embers — warm ember drift with trail fade. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Nebula Embers</title>
<style>html,body{margin:0;height:100%;background:#0A0705;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, quality = 1, embers = [];
  let fpsAcc = 0, fpsN = 0, degraded = false;
  const rand = (a, b) => a + Math.random() * (b - a);
  const HUES = [[255, 61, 0], [229, 169, 60], [255, 122, 40], [255, 214, 170]];

  function govern(dtMs) {
    if (degraded) return;
    fpsAcc += dtMs; fpsN++;
    if (fpsN >= 120) { if (fpsAcc / fpsN > 21) { degraded = true; quality *= 0.6; build(); } fpsAcc = 0; fpsN = 0; }
  }
  function spawn(initial) {
    const h = HUES[Math.floor(Math.random() * HUES.length)];
    return { x: rand(0, W), y: initial ? rand(0, H) : H + rand(4, 40), r: rand(0.5, 2.6),
      vy: rand(14, 46), sway: rand(0.4, 1.6), phase: Math.random() * Math.PI * 2, hue: h, a: rand(0.35, 0.95) };
  }
  function build() { embers = []; const n = Math.max(40, Math.round(150 * quality)); for (let i = 0; i < n; i++) embers.push(spawn(true)); }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0A0705'; ctx.fillRect(0, 0, W, H);
    build();
  }
  function draw(t, dt) {
    // translucent wash leaves soft trails
    ctx.fillStyle = 'rgba(10,7,5,0.22)'; ctx.fillRect(0, 0, W, H);
    // ambient corner glows
    const g1 = ctx.createRadialGradient(W * 0.12, H * 0.92, 0, W * 0.12, H * 0.92, W * 0.5);
    g1.addColorStop(0, 'rgba(255,61,0,0.075)'); g1.addColorStop(1, 'rgba(255,61,0,0)');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
    embers.forEach((e, i) => {
      e.y -= e.vy * dt;
      e.x += Math.sin(t * 0.0007 * e.sway + e.phase) * 0.32;
      const flicker = 0.55 + 0.45 * Math.sin(t * 0.0032 + e.phase * 3);
      const [r, g, b] = e.hue;
      ctx.globalAlpha = e.a * flicker;
      const glow = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 6);
      glow.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.55)');
      glow.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,236,214,' + (e.a * flicker) + ')';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.62, 0, Math.PI * 2); ctx.fill();
      if (e.y < -12) embers[i] = spawn(false);
    });
    ctx.globalAlpha = 1;
  }
  let prev = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000 || 0.016);
    govern(t - prev); prev = t;
    draw(t, dt);
    if (!RM) requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (RM) { ctx.fillStyle = '#0A0705'; ctx.fillRect(0, 0, W, H); draw(0, 0); } else requestAnimationFrame((t) => { prev = t; frame(t); });
})();
</script>
</body>
</html>
