<!DOCTYPE html>
<!-- Atelier Kinetik · FX 13 · Ink Ripple — tap drops ink that blooms into expanding rings. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Ink Ripple</title>
<style>html,body{margin:0;height:100%;background:#0B0A08;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:pointer}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, ripples = [], sparks = [];
  let autoTimer = 0;
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drop(x, y) {
    ripples.push({ x, y, t: 0, max: 2.4 });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 90;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.7 + Math.random() * 0.5 });
    }
  }
  addEventListener('pointerdown', (e) => drop(e.clientX, e.clientY));

  function drawFrame(t, dt) {
    ctx.fillStyle = 'rgba(11,10,8,0.16)'; ctx.fillRect(0, 0, W, H);
    autoTimer -= dt;
    if (autoTimer <= 0 && ripples.length < 4) { drop(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.6)); autoTimer = 2.6 + Math.random() * 1.6; }
    // ripples: wobbling ivory rings
    ripples = ripples.filter(r => r.t < r.max);
    ripples.forEach(r => {
      r.t += dt;
      const p = r.t / r.max;
      const radius = 12 + p * Math.min(W, H) * 0.42;
      const alpha = Math.pow(1 - p, 1.7) * 0.75;
      const wob = Math.sin(r.t * 6) * (1 - p) * 6 + Math.sin(r.t * 13 + 1) * (1 - p) * 3;
      ctx.strokeStyle = 'rgba(244,242,236,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 1.6 + (1 - p) * 1.6;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, radius + wob, (radius + wob) * 0.94, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(244,242,236,' + (alpha * 0.4).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, radius * 0.62 + wob * 0.7, radius * 0.58, 0, 0, Math.PI * 2); ctx.stroke();
      // central ink bloom
      const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 90 * (1 - p) + 6);
      g.addColorStop(0, 'rgba(28,24,18,' + (0.85 * (1 - p * 0.7)) + ')');
      g.addColorStop(1, 'rgba(28,24,18,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(r.x, r.y, 120, 0, Math.PI * 2); ctx.fill();
    });
    // ink droplets flung outward
    sparks = sparks.filter(s => s.life > 0);
    sparks.forEach(s => {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.985; s.vy *= 0.985; s.life -= dt;
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = '#E8E4D8';
      ctx.fillRect(s.x, s.y, 1.6, 1.6);
    });
    ctx.globalAlpha = 1;
  }
  let prev = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000 || 0.016);
    prev = t;
    drawFrame(t, dt);
    if (!RM) requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (RM) { ctx.fillStyle = '#0B0A08'; ctx.fillRect(0, 0, W, H); drop(W * 0.5, H * 0.45); drawFrame(0, 0.9); }
  else { ctx.fillStyle = '#0B0A08'; ctx.fillRect(0, 0, W, H); autoTimer = 0; drop(W * 0.62, H * 0.4); requestAnimationFrame((t) => { prev = t; frame(t); }); }
})();
</script>
</body>
</html>
