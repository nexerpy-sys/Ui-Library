<!DOCTYPE html>
<!-- Atelier Kinetik · FX 15 · Mesh Gradient Drift — orbiting radial blobs, screen blend, zero particles. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik FX — Mesh Gradient Drift</title>
<style>html,body{margin:0;height:100%;background:#070709;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;
  const TAU = Math.PI * 2;
  const BLOBS = [
    { hue: '255,61,0',   baseA: 0.5,  rx: 0.30, ry: 0.24, sx: 0.30, sy: 0.20, px: 0.0, py: 1.9, r: 0.46 },
    { hue: '124,155,255', baseA: 0.42, rx: 0.26, ry: 0.30, sx: 0.22, sy: 0.27, px: 2.1, py: 0.4, r: 0.42 },
    { hue: '0,240,255',  baseA: 0.26, rx: 0.22, ry: 0.18, sx: 0.34, sy: 0.30, px: 4.2, py: 3.4, r: 0.30 },
    { hue: '229,169,60', baseA: 0.30, rx: 0.18, ry: 0.22, sx: 0.26, sy: 0.22, px: 5.3, py: 2.6, r: 0.26 },
    { hue: '167,139,250', baseA: 0.30, rx: 0.34, ry: 0.16, sx: 0.19, sy: 0.33, px: 1.2, py: 4.7, r: 0.34 },
  ];
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw(t) {
    ctx.fillStyle = '#070709'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    BLOBS.forEach(b => {
      const x = W * (0.5 + b.rx * Math.sin(t * 0.00005 + b.px));
      const y = H * (0.46 + b.ry * Math.cos(t * 0.00006 + b.py));
      const r = Math.min(W, H) * b.r * (1 + 0.12 * Math.sin(t * 0.00008 + b.px * 2));
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(40, r));
      g.addColorStop(0, 'rgba(' + b.hue + ',' + b.baseA + ')');
      g.addColorStop(1, 'rgba(' + b.hue + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    });
    ctx.globalCompositeOperation = 'source-over';
    // soft vignette to keep edges cinematic
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.85);
    v.addColorStop(0, 'rgba(7,7,9,0)'); v.addColorStop(1, 'rgba(7,7,9,0.55)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  let prev = 0;
  function frame(t) {
    prev = t;
    draw(t);
    if (!RM) requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  if (RM) draw(12000); else requestAnimationFrame((t) => { prev = t; frame(t); });
})();
</script>
</body>
</html>
