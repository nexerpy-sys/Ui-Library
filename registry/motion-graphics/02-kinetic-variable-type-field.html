<!DOCTYPE html>
<!-- Atelier Kinetik · Motion Graphics 02 · Kinetic Variable Type Field — glyphs repel on cursor velocity vectors; elastic snap-back; live wght axis. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik Motion — Kinetic Variable Type Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070709; --surface:#0D0D12; --ink:#F4F2EC; --muted:#8E8D8A;
    --flame:#FF3D00; --cyan:#00F0FF; --gold:#E5A93C;
    --line:rgba(244,242,236,.10); --line-strong:rgba(244,242,236,.24); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); -webkit-font-smoothing:antialiased; }
  body { position:relative; display:flex; align-items:center; justify-content:center; cursor:crosshair;
    background:radial-gradient(60vw 46vh at 18% -10%, rgba(0,240,255,.06), transparent 60%), var(--bg); }
  .hud { position:absolute; top:1.1rem; left:1.25rem; font-family:"JetBrains Mono", monospace;
    font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); }
  .hud b { color:var(--cyan); font-weight:500; }
  .vec { position:absolute; top:1.1rem; right:1.25rem; font-family:"JetBrains Mono", monospace;
    font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:right; line-height:1.9; }
  .vec output { color:var(--ink); }
  #field { display:grid; grid-template-columns:repeat(9, auto); gap:0 .34em;
    user-select:none; pointer-events:none; line-height:1.02; }
  .glyph { font-family:"Hanken Grotesk", system-ui, sans-serif; font-weight:500;
    font-size:clamp(2.6rem, 9.2vw, 6.4rem); color:var(--ink);
    font-variation-settings:"wght" 500; will-change:transform, font-variation-settings;
    display:inline-block; transform-origin:50% 62%; }
  .glyph.accent { color:var(--flame); }
</style>
</head>
<body>
<script>/* Kinetik theming: parent explorer injects via postMessage or ?theme= — Obsidian/Paper/Aegean */
(function(){var T={obsidian:{'--bg':'#070709','--surface':'#0D0D12','--elevated':'#12121A','--ink':'#F4F2EC','--muted':'#8E8D8A','--flame':'#FF3D00','--cyan':'#00F0FF','--gold':'#E5A93C','--line':'rgba(244,242,236,.10)','--line-strong':'rgba(244,242,236,.24)'},paper:{'--bg':'#FBFAF7','--surface':'#F4F2EC','--elevated':'#ECEAE3','--ink':'#171512','--muted':'#5F5D58','--flame':'#C93300','--cyan':'#0B7285','--gold':'#8A6A1F','--line':'rgba(23,21,18,.14)','--line-strong':'rgba(23,21,18,.30)'},aegean:{'--bg':'#081521','--surface':'#0F2231','--elevated':'#173043','--ink':'#E9F1F5','--muted':'#7E93A3','--flame':'#FF6B35','--cyan':'#3ED6FF','--gold':'#E5A93C','--line':'rgba(233,241,245,.12)','--line-strong':'rgba(233,241,245,.28)'}};function apply(n){var t=T[n];if(!t)return;var r=document.documentElement,k;for(k in t)r.style.setProperty(k,t[k]);}var q=new URLSearchParams(location.search).get('theme');if(q)apply(q);window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='ak-theme'){apply(d.theme);window.dispatchEvent(new CustomEvent('ak-theme-applied',{detail:d.theme}));}});})();</script>

<p class="hud"><b>01</b>&nbsp;&nbsp;Variable wght axis · cursor-velocity repulsion</p>
<p class="vec">vx <output id="vx">+0.00</output><br>vy <output id="vy">+0.00</output></p>
<div id="field" aria-hidden="true"></div>

<script>
(() => {
  'use strict';
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const field = document.getElementById('field');
  const vxOut = document.getElementById('vx'), vyOut = document.getElementById('vy');

  /* 6 rows × 9 cols = 54 glyphs, one flame accent per row */
  const WORD = 'KINETIK';
  const states = [];
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 9; col++) {
      const ch = WORD[(row * 3 + col) % WORD.length];
      const span = document.createElement('span');
      span.className = 'glyph' + ((col === 4 + (row % 2) * 2) ? ' accent' : '');
      span.textContent = ch;
      field.appendChild(span);
      states.push({ el: span, x: 0, y: 0, vx: 0, vy: 0, wght: 500, skew: 0, vSkew: 0, cx: 0, cy: 0, measured: false });
    }
  }

  const K = 120, C = 14;                 /* spring-damper: elastic snap-back */
  const SIGMA = 150;                     /* gaussian influence radius */
  let px = -9999, py = -9999, vx = 0, vy = 0, lastT = 0, lastX = null, lastY = null, active = false;

  window.addEventListener('pointermove', (e) => {
    const now = performance.now();
    if (lastX != null) {
      const dt = Math.max(8, now - lastT) / 1000;
      const nvx = (e.clientX - lastX) / dt, nvy = (e.clientY - lastY) / dt;
      vx = vx * 0.72 + nvx * 0.28;       /* exponential smoothing on velocity vector */
      vy = vy * 0.72 + nvy * 0.28;
    }
    lastX = e.clientX; lastY = e.clientY; lastT = now; px = e.clientX; py = e.clientY; active = true;
  }, { passive: true });
  window.addEventListener('pointerleave', () => { active = false; vx = 0; vy = 0; });

  function measure() {
    states.forEach((s) => {
      const r = s.el.getBoundingClientRect();
      s.cx = r.left + r.width / 2 - s.x;   /* rest-position center (untransformed) */
      s.cy = r.top + r.height / 2 - s.y;
      s.measured = true;
    });
  }
  measure();
  window.addEventListener('resize', measure);

  function tick() {
    if (vxOut) vxOut.textContent = (vx >= 0 ? '+' : '') + (vx / 100).toFixed(2);
    if (vyOut) vyOut.textContent = (vy >= 0 ? '+' : '') + (vy / 100).toFixed(2);
    const speed = Math.hypot(vx, vy);
    states.forEach((s) => {
      const dx = s.cx - px, dy = s.cy - py;
      const dist = Math.hypot(dx, dy) || 1;
      const fall = Math.exp(-(dist * dist) / (2 * SIGMA * SIGMA));
      /* repulsion along radial direction, boosted by cursor speed */
      const kick = (active ? (52 + Math.min(240, speed * 0.16)) * fall : 0);
      const fx = (dx / dist) * kick, fy = (dy / dist) * kick;
      /* spring-damper integration (semi-implicit Euler) */
      s.vx += (fx - s.x * K - s.vx * C) * 0.016;
      s.vy += (fy - s.y * K - s.vy * C) * 0.016;
      s.x += s.vx * 0.016; s.y += s.vy * 0.016;
      /* weight & slant track gaussian proximity + cursor velocity direction */
      const targetW = 500 + (active ? fall * (speed > 40 ? 280 : 150) : 0);
      const targetSkew = active ? fall * Math.max(-16, Math.min(16, vx * 0.010)) : 0;
      s.wght += (Math.max(100, Math.min(900, targetW)) - s.wght) * 0.18;
      const skewAcc = (targetSkew - s.skew) * 90 - s.vSkew * 10;
      s.vSkew += skewAcc * 0.016; s.skew += s.vSkew * 0.016;
      s.el.style.transform = `translate3d(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px, 0) skewX(${s.skew.toFixed(2)}deg)`;
      s.el.style.fontVariationSettings = `"wght" ${s.wght.toFixed(1)}`;
    });
    vx *= 0.94; vy *= 0.94;              /* velocity decays when pointer rests */
    requestAnimationFrame(tick);
  }
  if (RM) {
    states.forEach((s) => { s.el.style.fontVariationSettings = '"wght" 640'; });
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
