<!DOCTYPE html>
<!-- Atelier Kinetik · Motion Graphics 08 · Verlet Cloth Ribbon — structural-constraint verlet mesh with pin points, gravity, wind turbulence and pointer dragging. Zero dependencies. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik Motion — Verlet Cloth Ribbon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070709; --surface:#0D0D12; --ink:#F4F2EC; --muted:#8E8D8A;
    --flame:#FF3D00; --cyan:#00F0FF; --gold:#E5A93C;
    --line:rgba(244,242,236,.10); --line-strong:rgba(244,242,236,.24); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); -webkit-font-smoothing:antialiased; }
  body { position:relative;
    background:radial-gradient(70vw 50vh at 50% -18%, rgba(229,169,60,.08), transparent 60%), var(--bg); }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
  canvas.grabbing { cursor:grabbing; }
  .hud { position:absolute; top:1.1rem; left:1.25rem; font-family:"JetBrains Mono", monospace;
    font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); pointer-events:none; }
  .hud b { color:var(--gold); font-weight:500; }
  .hint { position:absolute; bottom:1.15rem; left:50%; transform:translateX(-50%);
    font-family:"JetBrains Mono", monospace; font-size:8.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); white-space:nowrap; pointer-events:none; }
</style>
</head>
<body>
<script>/* Kinetik theming: parent explorer injects via postMessage or ?theme= — Obsidian/Paper/Aegean */
(function(){var T={obsidian:{'--bg':'#070709','--surface':'#0D0D12','--elevated':'#12121A','--ink':'#F4F2EC','--muted':'#8E8D8A','--flame':'#FF3D00','--cyan':'#00F0FF','--gold':'#E5A93C','--line':'rgba(244,242,236,.10)','--line-strong':'rgba(244,242,236,.24)'},paper:{'--bg':'#FBFAF7','--surface':'#F4F2EC','--elevated':'#ECEAE3','--ink':'#171512','--muted':'#5F5D58','--flame':'#C93300','--cyan':'#0B7285','--gold':'#8A6A1F','--line':'rgba(23,21,18,.14)','--line-strong':'rgba(23,21,18,.30)'},aegean:{'--bg':'#081521','--surface':'#0F2231','--elevated':'#173043','--ink':'#E9F1F5','--muted':'#7E93A3','--flame':'#FF6B35','--cyan':'#3ED6FF','--gold':'#E5A93C','--line':'rgba(233,241,245,.12)','--line-strong':'rgba(233,241,245,.28)'}};function apply(n){var t=T[n];if(!t)return;var r=document.documentElement,k;for(k in t)r.style.setProperty(k,t[k]);}var q=new URLSearchParams(location.search).get('theme');if(q)apply(q);window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='ak-theme'){apply(d.theme);window.dispatchEvent(new CustomEvent('ak-theme-applied',{detail:d.theme}));}});})();</script>

<p class="hud"><b>07</b>&nbsp;&nbsp;Verlet integration · 36×4 mesh · constraint relaxation ×3</p>
<canvas id="c" role="img" aria-label="Cloth ribbon banner — drag the fabric"></canvas>
<p class="hint">Grab the ribbon · pin constraints at both mounts</p>

<script>
(() => {
  'use strict';
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  if (!ctx) { cv.style.display = 'none'; return; }
  const PAL = { bg:'#070709', ink:'#F4F2EC', flame:'#FF3D00', gold:'#E5A93C', cyan:'#00F0FF', muted:'#8E8D8A', surface:'#0D0D12' };
  function tk(){ try { const cs = getComputedStyle(document.documentElement);
    ['bg','ink','flame','gold','cyan','muted','surface'].forEach(k => { const v = cs.getPropertyValue('--' + k); if (v) PAL[k] = v.trim(); }); } catch (e) {} }
  tk(); window.addEventListener('ak-theme-applied', () => { tk(); });

  const COLS = 36, ROWS = 4;
  let W = 0, H = 0, dpr = 1;
  let pts = [], cons = [], grabIdx = -1, px = 0, py = 0;

  function build() {
    pts = []; cons = [];
    const span = Math.min(W * 0.78, 880);
    const x0 = (W - span) / 2, y0 = H * 0.30, rowH = 34;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = x0 + (span * c) / (COLS - 1);
        const y = y0 + r * rowH;
        pts.push({ x, y, px: x, py: y, pin: c === 0 || c === COLS - 1, row: r, col: c });
      }
    }
    const idx = (r, c) => r * COLS + c;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c < COLS - 1) cons.push([idx(r, c), idx(r, c + 1), span / (COLS - 1)]);
        if (r < ROWS - 1) cons.push([idx(r, c), idx(r + 1, c), rowH]);
        if (c < COLS - 1 && r < ROWS - 1) {           /* shear diagonals keep the weave honest */
          const d = Math.hypot(span / (COLS - 1), rowH);
          cons.push([idx(r, c), idx(r + 1, c + 1), d]);
          cons.push([idx(r + 1, c), idx(r, c + 1), d]);
        }
      }
    }
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (RM) { for (let i = 0; i < 300; i++) simulate(1 / 60, 0); render(0.016); }
  }
  function simulate(dt, t) {
    const g = 1500;
    for (let i = 0; i < pts.length; i++) {           /* verlet step */
      const p = pts[i];
      if (p.pin || i === grabIdx) continue;
      const vx = (p.x - p.px) * 0.986, vy = (p.y - p.py) * 0.986;   /* damping */
      p.px = p.x; p.py = p.y;
      const wind = Math.sin(p.y * 0.018 + t * 1.35 + p.col * 0.12) * Math.cos(t * 0.72 + p.col * 0.05) * 260
                 + Math.sin(t * 0.21) * Math.sin(t * 0.21) * 150;    /* gusting envelope */
      p.x += vx + wind * dt * dt;
      p.y += vy + g * dt * dt;
    }
    if (grabIdx >= 0) { pts[grabIdx].x = px; pts[grabIdx].y = py; pts[grabIdx].px = px; pts[grabIdx].py = py; }
    for (let k = 0; k < 3; k++) {                     /* constraint relaxation */
      for (let i = 0; i < cons.length; i++) {
        const [a, b, rest] = cons[i];
        const pa = pts[a], pb = pts[b];
        let dx = pb.x - pa.x, dy = pb.y - pa.y;
        const dist = Math.hypot(dx, dy) || 1e-6;
        const diff = (dist - rest) / dist;
        const aPinned = pa.pin || a === grabIdx, bPinned = pb.pin || b === grabIdx;
        if (aPinned && bPinned) continue;
        if (aPinned) { pb.x -= dx * diff; pb.y -= dy * diff; }
        else if (bPinned) { pa.x += dx * diff; pa.y += dy * diff; }
        else { pa.x += dx * diff * 0.5; pa.y += dy * diff * 0.5; pb.x -= dx * diff * 0.5; pb.y -= dy * diff * 0.5; }
      }
    }
  }
  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    const idx = (r, c) => r * COLS + c;
    /* fabric body — gradient across the ribbon width */
    ctx.beginPath();
    const top = [];
    for (let c = 0; c < COLS; c++) top.push(pts[idx(0, c)]);
    for (let c = COLS - 1; c >= 0; c--) top.push(pts[idx(ROWS - 1, c)]);
    ctx.moveTo(top[0].x, top[0].y);
    top.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, H * 0.24, 0, H * 0.62);
    grad.addColorStop(0, PAL.flame);
    grad.addColorStop(0.52, PAL.gold);
    grad.addColorStop(1, PAL.surface);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.94;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.2; ctx.stroke();
    /* woven seam lines */
    ctx.globalAlpha = 0.45;
    [1, 2].forEach(r => {
      ctx.beginPath();
      for (let c = 0; c < COLS; c++) { const p = pts[idx(r, c)]; c ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
      ctx.strokeStyle = 'rgba(7,7,9,0.65)'; ctx.lineWidth = 1; ctx.stroke();
    });
    ctx.globalAlpha = 1;
    /* KINETIK lettering riding the centerline */
    const txt = 'KINETIK — MOTION IS THE MESSAGE';
    ctx.font = '700 12px Syne, "Hanken Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(7,7,9,0.88)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const chars = txt.split('');
    for (let i = 0; i < chars.length; i++) {
      const c = 1 + Math.floor((i * (COLS - 3)) / chars.length);
      const a = pts[idx(1, c)], b = pts[idx(1, c + 1)];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.save();
      ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2 + 4);
      ctx.rotate(ang);
      ctx.fillText(chars[i], 0, 0);
      ctx.restore();
    }
    /* mount bolts */
    [0, COLS - 1].forEach(c => {
      const p = pts[idx(0, c)];
      ctx.beginPath(); ctx.arc(p.x, p.y - 4, 5, 0, Math.PI * 2);
      ctx.fillStyle = PAL.ink; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y - 4, 2, 0, Math.PI * 2);
      ctx.fillStyle = PAL.flame; ctx.fill();
    });
  }
  function frame(t) {
    simulate(1 / 60, t * 0.001);
    render(1 / 60);
    if (!RM) requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect();
    let best = -1, bd = 46;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - (e.clientX - r.left), pts[i].y - (e.clientY - r.top));
      if (d < bd) { bd = d; best = i; }
    }
    grabIdx = best; px = e.clientX - r.left; py = e.clientY - r.top;
    cv.classList.add('grabbing');
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', (e) => {
    if (grabIdx < 0) return;
    const r = cv.getBoundingClientRect();
    px = e.clientX - r.left; py = e.clientY - r.top;
  });
  const release = (e) => { grabIdx = -1; cv.classList.remove('grabbing'); if (e) { try { cv.releasePointerCapture(e.pointerId); } catch (err) {} } };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  resize();
  window.addEventListener('resize', resize);
  if (!RM) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
